name: go-mod-cache
description: Cache Go's module and build cache. Run after setup, once mise has activated Go.
runs:
  using: composite
  steps:
    - name: Get Go version
      id: go-version
      shell: bash
      run: |
        GO_VERSION=$(mise current go)
        echo "go=${GO_VERSION:?mise current go returned nothing}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ steps.go-version.outputs.go }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ steps.go-version.outputs.go }}-
