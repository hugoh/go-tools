---
name: go-hk

on:
  workflow_call: {}

jobs:
  hk:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: go-hk-hk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28
        with:
          fetch-depth: 0
      - uses: hugoh/gh-workflows/hk-check@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
