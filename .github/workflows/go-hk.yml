---
name: go-hk

on:
  workflow_call: {}

jobs:
  hk:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: go-hk-hk-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@8c946a496e3f02569b0964bda0eba79a2082660d # v1.40.8
        with:
          fetch-depth: 0
      - uses: hugoh/gh-workflows/hk-check@8c946a496e3f02569b0964bda0eba79a2082660d # v1.40.8
        env:
          PINACT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
