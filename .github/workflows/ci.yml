---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      render: ${{ steps.filter.outputs.render == 'true' || fromJSON(steps.mise-tool-bumps.outputs.tools).copier == true }}
      renovate: ${{ steps.filter.outputs.renovate == 'true' || fromJSON(steps.mise-tool-bumps.outputs.tools)['npm:renovate'] == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            render:
              - '.github/workflows/**'
              - 'template/**'
              - 'test/fixtures/**'
              - 'test/test_render_check.py'
              - 'test/requirements-render-check.txt'
              - 'mise-tasks/render-check'
              - 'copier.yml'
            renovate:
              - '.github/workflows/**'
              - '.renovaterc.json'
              - 'go-renovaterc.json'
              - 'presets/**'
              - 'template/.renovaterc.json'
      # mise.toml pins the copier/renovate CLI *tool* versions this repo itself
      # runs with — separate from the paths above, which only cover
      # copier/renovate *config* files. A Renovate-driven bump of either tool's
      # pinned version in mise.toml should also trigger the matching check,
      # without making every unrelated mise.toml tool bump (shellcheck, hk,
      # etc.) trigger both.
      - name: Detect mise.toml tool version bumps
        id: mise-tool-bumps
        uses: hugoh/gh-workflows/tool-bumps@def9793db21b497f44589cf409bc7d212166abc3 # v1.13.0

  hk:
    uses: ./.github/workflows/go-hk.yml
    permissions:
      contents: read

  render-check:
    needs: changes
    # Always run on push/dispatch so the release job's `needs` are never
    # skipped (a skipped need skips release too). Only the paths filter on PRs.
    if: github.event_name != 'pull_request' || needs.changes.outputs.render == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@def9793db21b497f44589cf409bc7d212166abc3 # v1.13.0
      # render-check renders template/hk.pkl.jinja into throwaway tmpdirs and
      # runs `hk validate` against each; that populates the shared pkl package
      # cache (~/.pkl/cache) from scratch on every cold runner, which is the
      # bulk of the job's wall time. Key on the template's pkl deps so a pin
      # bump busts it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pkl/cache
            ~/.cache/uv
          key: render-check-${{ runner.os }}-${{ hashFiles('template/hk.pkl.jinja', 'test/requirements-render-check.txt') }}
          restore-keys: render-check-${{ runner.os }}-
      - name: Render check
        run: mise run render-check

  renovate-check:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.renovate == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # hk check pulls in the always-on conventional_commit step
      # (cog check --from-latest-tag), which needs tags and full history.
      - uses: hugoh/gh-workflows/setup@def9793db21b497f44589cf409bc7d212166abc3 # v1.13.0
        with:
          fetch-depth: 0
      - name: hk check (renovate config)
        run: hk check --no-progress --profile ci-renovate --all --no-fail-fast

  release:
    needs: [hk, render-check, renovate-check]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "::error::Manual dispatch must run on main (got ${GITHUB_REF})"
          exit 1
      - name: Bump version
        uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          command: bump
          args: ${{ (github.event_name == 'workflow_dispatch' && inputs.bump_type != 'auto') && format('--{0}', inputs.bump_type) || '--auto' }}
      - name: Push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -z "$TAG" ]; then
            echo "No version bump needed"
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "${TAG}"
          gh release create "${TAG}" --generate-notes
