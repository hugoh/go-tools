---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        type: choice
        description: "Version bump type"
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR runs; never cancel a push-to-main run mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      render: ${{ steps.filter.outputs.render == 'true' || fromJSON(steps.mise-tool-bumps.outputs.tools).copier == true }}
      renovate: ${{ steps.filter.outputs.renovate == 'true' || fromJSON(steps.mise-tool-bumps.outputs.tools)['npm:renovate'] == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            render:
              - '.github/workflows/**'
              - 'template/**'
              - 'test/fixtures/**'
              - 'test/test_render_check.py'
              - 'test/render-check-requirements.txt'
              - 'mise-tasks/render-check'
              - 'copier.yml'
            renovate:
              - '.github/workflows/**'
              - '.renovaterc.json'
              - 'go-renovaterc.json'
              - 'presets/**'
              - 'template/.renovaterc.json.jinja'
      # mise.toml pins the copier/renovate CLI *tool* versions this repo itself
      # runs with — separate from the paths above, which only cover
      # copier/renovate *config* files. A Renovate-driven bump of either tool's
      # pinned version in mise.toml should also trigger the matching check,
      # without making every unrelated mise.toml tool bump (shellcheck, hk,
      # etc.) trigger both.
      - name: Detect mise.toml tool version bumps
        id: mise-tool-bumps
        uses: hugoh/gh-workflows/tool-bumps@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28

  hk:
    uses: $/.github/workflows/go-hk.yml
    permissions:
      contents: read

  render-check:
    needs: changes
    # Always run on push/dispatch so a release is never cut without it. Only
    # the paths filter on PRs.
    if: github.event_name != 'pull_request' || needs.changes.outputs.render == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hugoh/gh-workflows/setup@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28
      # render-check renders the template into throwaway tmpdirs and runs
      # `hk validate` and `mise install` against each. The rendered mise.toml
      # pins tools this repo's own mise.toml doesn't (go, gotestsum,
      # deadcode, ...), so the setup action's mise cache never contains them
      # and they'd install from scratch on every run; cache them here too, and
      # the pkl package cache `hk validate` populates. Key on the template
      # files that carry those pins so a bump busts it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.pkl/cache
            ~/.cache/uv
            ~/.local/share/mise/installs
          key: render-check-${{ runner.os }}-${{ hashFiles('template/hk.pkl.jinja', 'template/mise.toml.jinja', 'test/render-check-requirements.txt') }}
          restore-keys: render-check-${{ runner.os }}-
      - name: Render check
        run: mise run render-check

  renovate-check:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.renovate == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # hk check pulls in the always-on conventional_commit step
      # (cog check --from-latest-tag), which needs tags and full history.
      - uses: hugoh/gh-workflows/setup@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28
        with:
          fetch-depth: 0
      - name: hk check (renovate config)
        run: hk check --no-progress --profile ci-renovate --all --no-fail-fast

  # The single required status check, and all that release waits on. The two
  # path-filtered checks may be skipped on a PR; everything else must pass.
  ci-gate:
    if: always()
    needs: [changes, hk, render-check, renovate-check]
    timeout-minutes: 2
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: render-check, renovate-check

  release:
    needs: ci-gate
    # A manual dispatch only releases from main; elsewhere the job is skipped.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    uses: hugoh/gh-workflows/.github/workflows/release.yml@1990006622d3176e00fbf0d3d0b40723cfe8dbeb # v1.40.28
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump_type || 'auto' }}
