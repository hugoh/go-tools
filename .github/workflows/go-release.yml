---
name: go-release

on:
  workflow_call:
    inputs:
      bump_type:
        type: string
        default: "auto"
        description: "Version bump type: auto, patch, minor, or major"
      has_goreleaser:
        type: boolean
        default: false
        description: "Whether the calling repo ships a .goreleaser.yml to build/publish"
    secrets:
      gh_token:
        required: true
      tap_github_token:
        required: false

# Scoped to the calling repo. Serialize releases; never cancel one mid-publish.
# PR dry-runs and pushes get separate groups so a queued dry-run can't bump
# a pending release out of its group's single pending slot.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' || github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      MISE_ENV: ci
    steps:
      # go, goreleaser (when has_goreleaser) and cocogitto all come from the
      # calling repo's own mise.toml — every repo built from this template
      # already declares them (template/mise.toml.jinja,
      # template/.config/mise/conf.d/go.toml) — so no install_args needed.
      - name: Setup
        uses: hugoh/gh-workflows/setup@b95b3bd62a98e3c18adbd6ed7e22f50908a50467 # v1.40.1
        with:
          fetch-depth: "0"
      - if: inputs.has_goreleaser
        uses: $/go-mod-cache
      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          echo "::error::Manual bump_type dispatch must run on main (got ${GITHUB_REF})"
          exit 1
      - name: Semver release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          BUMP_ARGS: ${{ inputs.bump_type == 'auto' && '--auto' || format('--{0}', inputs.bump_type) }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cog bump "$BUMP_ARGS"
      - name: Validate release
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
        run: |
          if [ "${{ inputs.has_goreleaser }}" = "true" ]; then
            set +e
            out=$(goreleaser check 2>&1)
            ec=$?
            set -e
            printf '%s\n' "$out"
            if [ "$ec" -ne 0 ]; then
              # goreleaser check fails even on configs it calls "valid" if
              # they use a deprecated property (e.g. brews instead of
              # homebrew_casks). Deprecation is a lint concern, not a
              # validity one, so don't hard-fail the release on it.
              if [ "$ec" -eq 2 ] && printf '%s\n' "$out" | grep -q 'configuration is valid, but uses deprecated properties'; then
                :
              else
                exit "$ec"
              fi
            fi
          fi
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "--- Dry-run: version preview ---"
            cog bump --auto --dry-run --skip-untracked || echo "(no version bump needed)"
            echo ""
            echo "--- Validating GITHUB_TOKEN setup ---"
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "FAIL: GITHUB_TOKEN is not set"
              exit 1
            fi
            echo "✓ GITHUB_TOKEN is set"
            if [ -z "$GITHUB_REPOSITORY" ]; then
              echo "FAIL: GITHUB_REPOSITORY is not set"
              exit 1
            fi
            echo "✓ GITHUB_REPOSITORY is ${GITHUB_REPOSITORY}"
            REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
            echo "${REMOTE_URL}" | grep -Eq '^https://x-access-token:.+@github\.com/.+/.+' || {
              echo "FAIL: remote URL format is invalid"
              exit 1
            }
            echo "✓ Remote URL format is valid"
            git ls-remote "${REMOTE_URL}" HEAD > /dev/null
            echo "✓ Git remote is accessible (token + URL work)"
            echo ""
            echo "Dry-run complete — no tag pushed or released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -z "$TAG" ]; then
            echo "No tag at HEAD — skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Push tag and Release
        if: steps.validate.outputs.skip != 'true'
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.gh_token }}
          TAP_GITHUB_TOKEN: ${{ secrets.tap_github_token }}
        run: |
          echo "Pushing ${TAG}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "${TAG}"
          echo "Releasing ${TAG}"
          if [ "${{ inputs.has_goreleaser }}" = "true" ]; then
            goreleaser release --clean
          else
            cog changelog --at "${TAG}" > /tmp/release-notes.md
            gh release create "${TAG}" --notes-file /tmp/release-notes.md
          fi
      - name: Merge Homebrew tap PR
        if: steps.validate.outputs.skip != 'true' && inputs.has_goreleaser == true
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.tap_github_token }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          if [ -z "${TAP_GITHUB_TOKEN:-}" ]; then
            echo "No tap_github_token secret - this repo doesn't publish to the tap"
            exit 0
          fi
          # goreleaser's pull_request.enabled defaults the branch name to
          # {{.ProjectName}}-{{.Version}}; only repos with a `brews:`/
          # `homebrew_casks:` block in .goreleaser.yml actually push one.
          BRANCH="${GITHUB_REPOSITORY#*/}-${TAG#v}"
          export GH_TOKEN="$TAP_GITHUB_TOKEN"
          PR_URL=$(gh pr list --repo hugoh/homebrew-tap --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -z "$PR_URL" ]; then
            echo "No open homebrew-tap PR for branch ${BRANCH} - nothing to merge"
            exit 0
          fi
          gh pr merge "$PR_URL" --repo hugoh/homebrew-tap --squash --delete-branch --auto
