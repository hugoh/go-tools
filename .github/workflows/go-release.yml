---
name: go-release

on:
  workflow_call:
    inputs:
      bump_type:
        type: string
        default: "auto"
        description: "Version bump type: auto, patch, minor, or major"
      has_goreleaser:
        type: boolean
        default: false
        description: "Whether the calling repo ships a .goreleaser.yml to build/publish"
      version:
        type: string
        default: ""
        description: "Release exactly this version, such as 5.0.0-rc.1 (a suffix makes it a pre-release); overrides bump_type"
      dry_run:
        type: boolean
        default: false
        description: "Bump and validate without pushing the tag or publishing"
    secrets:
      gh_token:
        required: true
      tap_github_token:
        required: false
      cloudsmith_api_key:
        required: false

# Scoped to the calling repo. Serialize releases; never cancel one mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # Skipped on pull_request: lint-release already runs in hk, and the release
    # path is only meaningful on main.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      MISE_ENV: ci
    steps:
      # go, goreleaser (when has_goreleaser) and cocogitto all come from the
      # calling repo's own mise.toml — every repo built from this template
      # already declares them (template/mise.toml.jinja,
      # template/.config/mise/conf.d/go.toml) — so no install_args needed.
      - name: Setup
        uses: hugoh/gh-workflows/setup@ae6e1b2ce64760b5418b71668bb9b0a74a3c4c70 # v1.40.22
        with:
          fetch-depth: "0"
      - if: inputs.has_goreleaser
        uses: $/go-mod-cache
      - name: Guard manual dispatch to main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && !inputs.dry_run
        env:
          GITHUB_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # A pre-release (a version with a suffix) may be cut from any branch.
          case "$RELEASE_VERSION" in *-*) exit 0 ;; esac
          echo "::error::A stable release must be dispatched on main (got ${GITHUB_REF}); pre-releases need a version such as 5.0.0-rc.1"
          exit 1
      - name: Check Cloudsmith repos exist
        if: inputs.has_goreleaser
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.cloudsmith_api_key }}
        run: |
          repos=$(grep -oE 'cloudsmith push [a-z]+ [^/ ]+/[^/ ]+' .goreleaser.yml | awk '{print $4}' | sort -u)
          for repo in $repos; do
            if ! cloudsmith repos get "$repo" > /dev/null; then
              echo "::error::Cloudsmith repo ${repo} not reachable; create it (cloudsmith repos create) and add it to ~/Code/iac/cloudsmith/repos.tf"
              exit 1
            fi
          done
      - name: Semver release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$RELEASE_VERSION" ]; then
            args=(--version "$RELEASE_VERSION")
          elif [ "$BUMP_TYPE" = auto ]; then
            args=(--auto)
          else
            args=("--$BUMP_TYPE")
          fi
          cog bump "${args[@]}"
      - name: Validate release
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.gh_token }}
        run: |
          if [ "${{ inputs.has_goreleaser }}" = "true" ]; then
            mise run lint-release
          fi
          TAG=$(git tag --points-at HEAD | head -1)
          if [ -z "$TAG" ]; then
            echo "No tag at HEAD — skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - name: Push tag and Release
        if: steps.validate.outputs.skip != 'true' && !inputs.dry_run
        env:
          TAG: ${{ steps.validate.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.gh_token }}
          TAP_GITHUB_TOKEN: ${{ secrets.tap_github_token }}
          CLOUDSMITH_API_KEY: ${{ secrets.cloudsmith_api_key }}
        run: |
          echo "Pushing ${TAG}"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git push origin "${TAG}"
          echo "Releasing ${TAG}"
          if [ "${{ inputs.has_goreleaser }}" = "true" ]; then
            goreleaser release --clean
          else
            cog changelog --at "${TAG}" > /tmp/release-notes.md
            prerelease=()
            case "$TAG" in *-*) prerelease+=(--prerelease) ;; esac
            gh release create "${TAG}" --notes-file /tmp/release-notes.md "${prerelease[@]}"
          fi
      - name: Prune old Cloudsmith packages
        if: steps.validate.outputs.skip != 'true' && !inputs.dry_run && inputs.has_goreleaser == true
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.cloudsmith_api_key }}
          KEEP_RELEASES: "2"
        run: |
          set -o pipefail
          repos=$(grep -oE 'cloudsmith push [a-z]+ [^/ ]+/[^/ ]+' .goreleaser.yml | awk '{print $4}' | sort -u)
          for repo in $repos; do
            cloudsmith ls pkgs "$repo" --page-all -F json |
              jq -r --argjson keep "$KEEP_RELEASES" '
                [.data[] | {slug: .slug_perm, format, version, at: .uploaded_at}]
                | group_by(.format)[]
                | group_by(.version)
                | sort_by(-(map(.at) | max | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601))
                | .[$keep:][][].slug' |
              while read -r slug; do
                echo "Deleting ${repo}/${slug}"
                cloudsmith delete -y "${repo}/${slug}"
              done
          done
      - name: Merge Homebrew tap PR
        if: steps.validate.outputs.skip != 'true' && !inputs.dry_run && inputs.has_goreleaser == true
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.tap_github_token }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          if [ -z "${TAP_GITHUB_TOKEN:-}" ]; then
            echo "No tap_github_token secret - this repo doesn't publish to the tap"
            exit 0
          fi
          # goreleaser's pull_request.enabled defaults the branch name to
          # {{.ProjectName}}-{{.Version}}; only repos with a `brews:`/
          # `homebrew_casks:` block in .goreleaser.yml actually push one.
          BRANCH="${GITHUB_REPOSITORY#*/}-${TAG#v}"
          export GH_TOKEN="$TAP_GITHUB_TOKEN"
          PR_URL=$(gh pr list --repo hugoh/homebrew-tap --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -z "$PR_URL" ]; then
            echo "No open homebrew-tap PR for branch ${BRANCH} - nothing to merge"
            exit 0
          fi
          gh pr merge "$PR_URL" --repo hugoh/homebrew-tap --squash --delete-branch --auto
