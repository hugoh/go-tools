---
name: go-ci

on:
  workflow_call: {}

jobs:
  goci:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: go-ci-goci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      MISE_ENV: ci
    steps:
      - uses: hugoh/gh-workflows/setup@bbbf25812da61dd48510494ce8d6c55e6f919aa6 # v1.40.13
      - uses: $/go-mod-cache
      - name: Mise CI
        run: mise ci
        env:
          MISE_TASK_TIMINGS: true
