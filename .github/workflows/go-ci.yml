---
name: go-ci

on:
  workflow_call: {}

jobs:
  goci:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: go-ci-goci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      MISE_ENV: ci
    steps:
      - uses: hugoh/gh-workflows/setup@20f042d18e1e5318722f808bafc6d7fc18a838f7 # v1.40.17
      - uses: $/go-mod-cache
      - name: Mise CI
        run: mise ci
        env:
          MISE_TASK_TIMINGS: true
