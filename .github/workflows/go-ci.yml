---
name: go-ci

on:
  workflow_call: {}

jobs:
  goci:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    concurrency:
      group: go-ci-goci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      MISE_ENV: ci
    steps:
      - uses: hugoh/gh-workflows/setup@b95b3bd62a98e3c18adbd6ed7e22f50908a50467 # v1.40.1
      - uses: $/go-mod-cache
      - name: Mise CI
        run: mise ci
        env:
          MISE_TASK_TIMINGS: true
